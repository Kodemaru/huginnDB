# This package is also the workspace root: `mcp-server/` is a sibling crate
# for the `huginndb-mcp` binary, kept out of this package's own `[[bin]]`
# list on purpose (see mcp-server/Cargo.toml and CLAUDE.md gotcha #19) so
# tauri-bundler's Windows bundling never enumerates it.
[workspace]
members = ["mcp-server"]
resolver = "2"

[package]
name = "huginndb"
version = "1.31.1"
description = "HuginnDB — minimal desktop database manager"
authors = ["HuginnDB contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "huginndb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
tauri-plugin-dialog = "2.0"
tauri-plugin-window-state = "2.0"
tauri-plugin-updater = "2.0"
tauri-plugin-process = "2.0"
# Opens external URLs (e.g. the GitHub issue page from the in-app reporter) in
# the OS default browser. `window.open` does nothing inside the Tauri WebView,
# so URL opening has to go through this plugin's `open_url` command. Registered
# unconditionally; the capability scopes it to https/http (see capabilities).
tauri-plugin-opener = "2.0"
# Forwards a second launch's argv to the already-running instance instead of
# spawning a new window, so the CLI consolidates into one window (see lib.rs
# `handle_second_instance`). Desktop-only; registered under `#[cfg(desktop)]`.
tauri-plugin-single-instance = "2.0"
# Reads and writes the OS clipboard from Rust (arboard) instead of the
# WebView's own async Clipboard API. Two reasons, both user-visible: the
# webview's `readText()` triggers WebView2's native "allow this site to see
# your clipboard" prompt, which the app cannot style, suppress or even
# reword, and its `writeText()` lands in the webview's own channel rather
# than the system clipboard, so a copied cell was gone the moment anything
# else was copied. See gotcha #63.
tauri-plugin-clipboard-manager = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "mysql",
    "sqlite",
    "json",
    "chrono",
    "uuid",
    "rust_decimal",
    "bigdecimal",
] }
# `TryStreamExt::try_next`, for streaming a SELECT's rows one at a time so an
# ad-hoc query (editor SQL, no `LIMIT`/`TOP` of its own) can be capped at
# `MAX_ADHOC_QUERY_ROWS` without first buffering the whole result set (the
# `fetch_all`/`tiberius::into_results` OOM this guards against — see
# CLAUDE.md gotcha on ad-hoc query row caps). Already resolved at 0.3.32
# transitively via sqlx/tiberius/mongodb; this only turns it into a direct
# dependency so `db/mongo/query.rs` and `commands/query.rs` can `use` it — no
# new crate enters the tree (same rationale as the `bson` pin above).
futures-util = "0.3"
mongodb = { version = "3", default-features = false, features = [
    "rustls-tls",
    "dns-resolver",
    "bson-3",
    "compat-3-3-0",
] }
# Same `bson` already pulled in by `mongodb` (3.x), pinned here only to turn on
# its `serde_json-1` feature — this enables the canonical Extended JSON
# serializer (`Bson::into_canonical_extjson`) and parser (`Bson::try_from::<
# serde_json::Value>`) used by the MongoDB collection import/export (#65). No
# new crate enters the tree: both `bson` and `serde_json` are already deps.
bson = { version = "3", features = ["serde_json-1"] }
# Microsoft SQL Server (TDS). `sqlx` dropped its MSSQL driver after 0.6 and 0.8
# has no replacement, so this cannot be "one more sqlx feature" — it is a
# separate client with its own connection model, closer to the `mongodb` case.
# `tiberius` is the only pure-Rust TDS implementation; its last release is
# 0.12.3 (July 2024) though the repo is still active, which is a maintenance
# risk we accept knowingly (a `[patch.crates-io]` fork is the escape hatch).
#
# `default-features = false` drops `native-tls`, which would mean schannel on
# Windows but an OpenSSL *system* build dependency on the Linux CI leg. The
# `rustls` feature keeps the tree pure-Rust at the cost of pulling
# `tokio-rustls 0.24` (rustls 0.21) alongside the rustls 0.23 that
# sqlx/mongodb/russh/reqwest already share — a second rustls *version*, not a
# second TLS stack. Reviewed and accepted as the lesser evil; revisit on any
# `cargo update` that lets tiberius move to rustls 0.23.
#
# `tds73` = TDS 7.3 (SQL Server 2008+ date/time types). `chrono` +
# `rust_decimal` are what `ColumnData` needs to hand back real temporal and
# numeric values instead of opaque bytes. `sql-browser-tokio` provides
# `TcpStream::connect_named`, which resolves a named instance
# (`HOST\SQLEXPRESS`) through the SQL Browser's UDP 1434 service — very common
# in the on-prem installs this driver exists for.
tiberius = { version = "0.12", default-features = false, features = [
    "rustls",
    "tds73",
    "chrono",
    "rust_decimal",
    "sql-browser-tokio",
] }
keyring = { version = "3", features = [
    "windows-native",
    "apple-native",
    "sync-secret-service",
    "crypto-rust",
] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
url = "2"
parking_lot = "0.12"
# The OS account a managed policy assigns a role to (`policy::current_user`). Read
# from the operating system (`GetUserNameW`, `getpwuid`), never from `USERNAME`
# / `USER`, which whoever launches the process controls. Already in the tree
# through `sqlx-mysql` / `sqlx-postgres`, so declaring it adds no crate.
whoami = { version = "1.6", default-features = false }
russh = { version = "0.60", default-features = false, features = [
    "ring",
    "flate2",
    "rsa",
] }
# `compat` (new here) bridges tokio's `AsyncRead`/`AsyncWrite` to the
# `futures-io` traits `tiberius` is written against, so its client can be
# driven over a plain `tokio::net::TcpStream`.
tokio-util = { version = "0.7", features = ["rt", "compat"] }
# HTTP client for the in-app issue reporter (commands::feedback). rustls so it
# reuses the ring/rustls tree already pulled by sqlx/mongodb/russh — no second
# TLS stack, no OpenSSL/system build dep. `json` for the GitHub REST payload.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    # `stream` is what lets `themes::registry` enforce its download ceiling
    # against the bytes actually arriving rather than against a
    # `Content-Length` a server is free to get wrong or lie about.
    "stream",
] }
# Reading `.vsix` theme packages (commands::themes). A `.vsix` is a ZIP, and
# this crate is ALREADY in the lock file as a transitive dependency of the
# Tauri updater — declaring it directly adds a line here and nothing at all to
# the dependency tree or the build time.
zip = { version = "4", default-features = false, features = ["deflate"] }
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
# Headless MCP (Model Context Protocol) connector — see the `mcp` feature and
# `src/mcp/`. Optional so a normal `tauri:build` never compiles the extra tree.
# `server` + `transport-io` are all the read-only stdio server needs.
rmcp = { version = "2.2", features = [
    "server",
    "transport-io",
    "macros",
], optional = true }
# Tool-argument JSON Schemas. Kept at the same "1" major rmcp itself pulls, so
# cargo unifies to a single `schemars` and the derived `JsonSchema` impls are
# the type rmcp expects. Direct dep (rather than rmcp's re-export) because the
# derive macro emits absolute `schemars::` paths.
schemars = { version = "1", optional = true }
anyhow = { version = "1", optional = true }

# `AuthMethod::Windows` (NTLM with an explicit `DOMAIN\user` + password) is
# gated to `cfg(windows)` inside tiberius, so the feature that backs it can
# only be enabled there. The Linux CI leg compiles the same source with the
# SQL Server auth mode limited to SQL logins; see `db::mssql::auth`.
[target.'cfg(windows)'.dependencies]
tiberius = { version = "0.12", default-features = false, features = ["winauth"] }
# Reads the managed-policy anchor under `HKLM\SOFTWARE\Policies\HuginnDB`
# (`policy::source`) — the key Group Policy / Intune write and a standard user
# cannot. Already in the tree through `hickory-resolver` → `ipconfig`, so
# declaring it adds no crate.
windows-registry = "0.6"
# The taskbar Jump List (`jump_list`): `ICustomDestinationList` and the shell
# links it holds, plus `PKEY_Title` and the `PROPVARIANT` that names each one.
# Already in the tree through `webview2-com` (the WebView2 bindings Tauri uses),
# at this same version, so declaring it adds no crate — only these features.
windows = { version = "0.61", features = [
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
] }

[features]
custom-protocol = ["tauri/custom-protocol"]
# Compiles the `crate::mcp` module for the `huginndb-mcp` binary in the
# sibling `mcp-server` crate. Off by default: `pnpm tauri:build` / a plain
# `cargo build` here produce only the desktop app.
mcp = ["dep:rmcp", "dep:schemars", "dep:anyhow"]
# Canary build: isolates the on-disk state directory into `HuginnDB-Canary`
# (see src/app_identity.rs) so a pre-release can be dogfooded side-by-side with
# the stable install without risking production state. Pure compile-time
# switch — no extra dependencies. Paired at build time with
# `tauri.canary.conf.json` (separate bundle identifier + updater feed). The OS
# keychain service is deliberately NOT split by this feature (see keychain.rs).
canary = []
